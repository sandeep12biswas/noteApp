<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Same import map trick PluginManager's registration-iframe wrapper
         uses — see that file's `buildEntryDocumentHtml`/`pluginAssetUrl` for
         why a plain bare-specifier import needs one inside a sandboxed
         iframe, and why `flownote-plugin://` rather than a `file://`-relative
         path (a sandboxed iframe's opaque origin can't load `file://`
         subresources at all, regardless of path). The SDK path is
         root-relative, so it resolves against whichever scheme/host this
         page was served from — `flownote-plugin://localhost/` (Electron,
         Tauri on macOS/Linux) or `http://flownote-plugin.localhost/` (Tauri
         on Windows); see packages/frontend/src/lib/customProtocolUrl.ts. -->
    <script type="importmap">
      { "imports": { "@flownote/sdk": "/sdk/index.js" } }
    </script>
    <style>
      body {
        margin: 0;
        padding: 4px;
      }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <!-- import() after parsing rather than <script src>: on Windows (WebView2),
         a sandboxed frame's requests made while it's still parsing don't
         reach FlowNote's plugin handler (issue #33). Plugins with their own
         pages should do the same. -->
    <script type="module">
      import('./grid.js').catch((e) => console.error('Spreadsheet grid failed to load:', e))
    </script>
  </body>
</html>
