[package]
name = "flownote-core"
version = "0.1.0"
edition = "2024"

[dependencies]
automerge = "0.11.0"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "default-tls"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.10"
uuid = { version = "1.26.1", features = ["v4"] }
zeroize = "1"
