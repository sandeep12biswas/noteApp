# electron-builder config — Linux packaging only (DESIGN.md §3.2/§6.1: the
# Windows/macOS shells are Tauri, packaged separately under apps/tauri).
#
# The packaged app never reaches into the monorepo at runtime: the compiled
# frontend and the flownote-electron sidecar binary are copied in as
# `extraResources` at build time, and src/main.ts's sidecarBinaryPath() /
# frontendIndexPath() read them from `process.resourcesPath` when
# `app.isPackaged`. Run `pnpm run package` (after `pnpm build` and
# `cargo build --release -p flownote-electron`) to produce them.
appId: com.sandeep.flownote
productName: FlowNote
executableName: flownote
directories:
  output: release
  buildResources: build
# package.json's `name` is the scoped "@flownote/electron" — electron-builder's
# default artifactName template embeds that raw, producing an unwritable
# "release/@flownote/..." path (the "@flownote" segment is read as a
# directory). Override with productName instead, which has no slash.
artifactName: '${productName}-${version}-${arch}.${ext}'
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../../packages/frontend/dist
    to: frontend
  - from: ../../target/release/flownote-electron
    to: bin/flownote-electron
linux:
  target:
    - deb
    - AppImage
  category: Office
  maintainer: Sandeep Biswas <sandeep12.biswas@gmail.com>
  # Icon set generated by scripts/assets/make-installer-art.py from the
  # Tauri app icon, so both shells ship the same artwork.
  icon: build/icons
  synopsis: Canvas note-taking app
  description: FlowNote is a note-taking app with a free-form canvas editor - click anywhere on the page and start writing.
  desktop:
    Name: FlowNote
    Comment: Canvas note-taking app
    Categories: Office;TextEditor;
    Keywords: notes;notebook;canvas;writing;
    StartupWMClass: FlowNote
deb:
  # Replaces an install of an older FlowNote build cleanly on upgrade.
  packageName: flownote
  # Always make chrome-sandbox setuid root, or the app aborts at launch on
  # Ubuntu 24.04+ (AppArmor blocks user namespaces). See the script's header.
  afterInstall: build/linux/after-install.tpl
