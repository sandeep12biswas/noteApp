name: Linux installer

# Builds FlowNote's Linux release bundle from the Electron shell
# (apps/electron) with scripts/linux/package.sh — the same one-command clean
# build developers run — and uploads it as the `flownote-linux` artifact:
#   - `FlowNote-<version>-linux-x86_64.run`    self-extracting installer
#   - `FlowNote-<version>-linux-x86_64.tar.gz` the bundle folder: .deb,
#     .AppImage, install.sh / uninstall.sh (packaging/linux/), README, the
#     PDF user/feature guides, SHA256SUMS
# Then, on the runner, each install path is tested end to end: install →
# launch (must stay up and create its database) → uninstall → verify
# nothing is left behind.
#
# Unsigned. Runs on a pushed `v*` tag, or manually (workflow_dispatch —
# only available once this file is on the default branch).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@v2

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Clean build + bundle: frontend, Electron main process, release
      # sidecar, electron-builder (.deb + AppImage), then the bundle folder,
      # tar.gz and .run under dist-release/.
      - name: Build release bundle
        # Cloud sync app registrations (docs/sync-cloud-setup.md), compiled
        # in. Without these repository secrets the build still works; the
        # OneDrive / Google Drive options then say the build isn't registered.
        env:
          FLOWNOTE_ONEDRIVE_CLIENT_ID: ${{ secrets.FLOWNOTE_ONEDRIVE_CLIENT_ID }}
          FLOWNOTE_GOOGLE_CLIENT_ID: ${{ secrets.FLOWNOTE_GOOGLE_CLIENT_ID }}
          FLOWNOTE_GOOGLE_CLIENT_SECRET: ${{ secrets.FLOWNOTE_GOOGLE_CLIENT_SECRET }}
        run: ./scripts/linux/package.sh --skip-install

      - name: Locate bundle
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "BUNDLE=$PWD/dist-release/FlowNote-$version-linux-x86_64" >> "$GITHUB_ENV"
          echo "RUNFILE=$PWD/dist-release/FlowNote-$version-linux-x86_64.run" >> "$GITHUB_ENV"
          ls -l dist-release dist-release/FlowNote-$version-linux-x86_64

      - name: Verify checksums and guides
        run: |
          (cd "$BUNDLE" && sha256sum -c SHA256SUMS)
          test -s "$BUNDLE/docs/FlowNote-Installation-Guide.pdf"
          test -s "$BUNDLE/docs/FlowNote-User-Guide.pdf"
          test -s "$BUNDLE/docs/FlowNote-Feature-Guide.pdf"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: flownote-linux
          path: |
            dist-release/*.run
            dist-release/*.tar.gz
            dist-release/*.sha256
          if-no-files-found: error

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Launches `$1`, checks it stays up for 15 s and creates its database,
      # then closes it.
      - name: Write launch check
        run: |
          cat > "$RUNNER_TEMP/launch-check.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          db="$HOME/.config/@flownote/electron/flownote.sqlite3"
          xvfb-run -a "$@" > "$RUNNER_TEMP/app.log" 2>&1 &
          for _ in $(seq 1 30); do [ -f "$db" ] && break; sleep 1; done
          sleep 5
          if ! pgrep -x flownote >/dev/null; then
            cat "$RUNNER_TEMP/app.log"; echo "FlowNote exited right after launch"; exit 1
          fi
          [ -f "$db" ] || { cat "$RUNNER_TEMP/app.log"; echo "FlowNote is running but did not create $db"; exit 1; }
          echo "Launched OK; database at $db"
          EOF
          chmod +x "$RUNNER_TEMP/launch-check.sh"

      - name: "Test: .deb install -> launch -> uninstall"
        run: |
          set -euo pipefail
          "$BUNDLE/install.sh" --deb
          [ "$(dpkg-query -W -f='${Status}' flownote)" = "install ok installed" ]
          command -v flownote
          "$RUNNER_TEMP/launch-check.sh" flownote

          "$BUNDLE/uninstall.sh" --remove-data
          if dpkg-query -W -f='${Status}' flownote 2>/dev/null | grep -q "install ok installed"; then echo "package still installed"; exit 1; fi
          if [ -e /opt/FlowNote ]; then echo "/opt/FlowNote still present"; exit 1; fi
          if [ -e "$HOME/.config/@flownote/electron" ]; then echo "app data still present after --remove-data"; exit 1; fi
          if pgrep -x flownote; then echo "FlowNote still running"; exit 1; fi
          echo ".deb: install, launch and uninstall all OK"

      # No libfuse2 on the runner, so this also covers install.sh's
      # unpack-on-start fallback.
      - name: "Test: AppImage install -> launch -> uninstall"
        run: |
          set -euo pipefail
          "$BUNDLE/install.sh" --appimage
          for f in "$HOME/.local/opt/flownote/FlowNote.AppImage" "$HOME/.local/bin/flownote" "$HOME/.local/share/applications/flownote.desktop"; do
            [ -e "$f" ] || { echo "missing $f"; exit 1; }
          done
          "$RUNNER_TEMP/launch-check.sh" "$HOME/.local/bin/flownote"

          "$BUNDLE/uninstall.sh" --keep-data
          [ -f "$HOME/.config/@flownote/electron/flownote.sqlite3" ] || { echo "--keep-data deleted the notes"; exit 1; }
          "$BUNDLE/install.sh" --appimage
          "$BUNDLE/uninstall.sh" --remove-data
          for f in "$HOME/.local/opt/flownote" "$HOME/.local/bin/flownote" "$HOME/.local/share/applications/flownote.desktop" "$HOME/.config/@flownote/electron"; do
            if [ -e "$f" ]; then echo "$f still present"; exit 1; fi
          done
          echo "AppImage: install, launch and uninstall all OK"

      # The self-extracting installer, unattended; then the uninstaller that
      # the AppImage install carries inside itself.
      - name: "Test: .run installer -> launch -> bundled uninstaller"
        run: |
          set -euo pipefail
          "$RUNFILE" --appimage --silent
          [ "$(cat "$HOME/.local/opt/flownote/VERSION")" = "$(tr -d '[:space:]' < VERSION)" ]
          "$RUNFILE" --extract "$RUNNER_TEMP/extracted"
          [ -x "$RUNNER_TEMP/extracted/install.sh" ]
          "$RUNNER_TEMP/launch-check.sh" "$HOME/.local/bin/flownote"

          "$HOME/.local/opt/flownote/uninstall.sh" --remove-data
          for f in "$HOME/.local/opt/flownote" "$HOME/.local/bin/flownote" "$HOME/.local/share/applications/flownote.desktop" "$HOME/.config/@flownote/electron"; do
            if [ -e "$f" ]; then echo "$f still present"; exit 1; fi
          done
          echo ".run: install, launch and uninstall all OK"
