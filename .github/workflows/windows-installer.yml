name: Windows installer

# Builds FlowNote's Windows release bundle from the Tauri shell (apps/tauri)
# with scripts/windows/package.ps1 — the same one-command clean build
# developers run — and uploads it as the `flownote-windows` artifact
# (`FlowNote-<version>-windows-x64.zip`):
#   - `FlowNote_<version>_x64-setup.exe` — setup wizard (tauri.conf.json ->
#     bundle.windows.nsis: branded pages, release notice, Start Menu folder
#     with the FlowNote Guide PDF + uninstaller, optional desktop shortcut);
#     per-user, no admin needed; registers an uninstaller under Settings → Apps.
#   - `FlowNote_<version>_x64_en-US.msi` — uninstall the same way.
#   - `Uninstall FlowNote.cmd` + `Uninstall-FlowNote.ps1` — standalone
#     uninstaller for either install (packaging/windows/), README, the
#     FlowNote Guide (PDF + Word), SHA256SUMS.txt.
# Then, on the runner itself, each installer is tested end to end: silent
# install → launch (must stay up and create its database) → uninstall via
# Uninstall-FlowNote.ps1 → verify nothing is left behind.
#
# Unsigned: Windows SmartScreen will warn on first run ("More info" → "Run
# anyway"). Code signing needs a certificate this repo doesn't have yet.
#
# Runs on a pushed `v*` tag, or manually (workflow_dispatch — only available
# once this file is on the default branch).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@v2

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Clean build + bundle: `tauri build --bundles nsis,msi` (which builds
      # the frontend itself), then the bundle folder and zip under dist-release\.
      - name: Build release bundle
        # Cloud sync app registrations (docs/sync-cloud-setup.md), compiled
        # in. Without these repository secrets the build still works; the
        # OneDrive / Google Drive options then say the build isn't registered.
        env:
          FLOWNOTE_ONEDRIVE_CLIENT_ID: ${{ secrets.FLOWNOTE_ONEDRIVE_CLIENT_ID }}
          FLOWNOTE_GOOGLE_CLIENT_ID: ${{ secrets.FLOWNOTE_GOOGLE_CLIENT_ID }}
          FLOWNOTE_GOOGLE_CLIENT_SECRET: ${{ secrets.FLOWNOTE_GOOGLE_CLIENT_SECRET }}
        shell: pwsh
        run: ./scripts/windows/package.ps1 -SkipInstall

      # Later steps use `package/` — the bundle folder.
      - name: Locate bundle
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $bundle = "dist-release/FlowNote-$version-windows-x64"
          if (-not (Test-Path "$bundle/docs/FlowNote-Guide.pdf")) { throw 'FlowNote-Guide.pdf missing from the bundle' }
          Copy-Item -Recurse $bundle package
          Get-ChildItem -Recurse package | Format-Table FullName, Length

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: flownote-windows
          path: |
            dist-release/*.zip
            dist-release/*.sha256
          if-no-files-found: error

      - name: "Test: setup.exe install -> launch -> uninstall"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem package/*-setup.exe)[0].FullName
          Start-Process $setup -ArgumentList '/S' -Wait

          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object DisplayName -eq 'FlowNote'
          if (-not $entry) { throw 'setup.exe did not register an uninstall entry under HKCU' }
          $installDir = Split-Path $entry.UninstallString.Trim('"') -Parent
          $exe = Get-ChildItem $installDir -Filter *.exe | Where-Object Name -ne 'uninstall.exe' | Select-Object -First 1
          Write-Host "Installed to $installDir ($($exe.Name))"

          # hooks.nsh: the guide ships in the install, with a Start Menu entry.
          if (-not (Test-Path (Join-Path $installDir 'docs\FlowNote-Guide.pdf'))) { throw 'FlowNote-Guide.pdf not installed' }
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\FlowNote'
          foreach ($lnk in 'FlowNote.lnk', 'FlowNote Guide.lnk', 'Uninstall FlowNote.lnk') {
            if (-not (Test-Path (Join-Path $menu $lnk))) { throw "Start Menu entry missing: $lnk" }
          }

          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "FlowNote exited right after launch (code $($app.ExitCode))" }
          $db = Join-Path $env:APPDATA 'com.sandeep.flownote\flownote.sqlite3'
          if (-not (Test-Path $db)) { throw "FlowNote is running but did not create $db" }
          Write-Host "Launched OK; database at $db"

          & ./packaging/windows/Uninstall-FlowNote.ps1 -RemoveData
          if ($LASTEXITCODE -ne 0) { throw "Uninstall-FlowNote.ps1 exited with $LASTEXITCODE" }

          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object DisplayName -eq 'FlowNote') { throw 'uninstall entry still present' }
          if (Test-Path $exe.FullName) { throw "$($exe.FullName) still present" }
          if (Test-Path (Split-Path $db -Parent)) { throw 'app data still present after -RemoveData' }
          if (Test-Path $menu) { throw "Start Menu folder still present: $menu" }
          Write-Host 'setup.exe: install, launch and uninstall all OK'

      - name: "Test: MSI install -> launch -> uninstall"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem package/*.msi)[0].FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /i exited with $($p.ExitCode)" }

          $roots = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $entry = Get-ItemProperty $roots -ErrorAction SilentlyContinue | Where-Object DisplayName -eq 'FlowNote'
          if (-not $entry) { throw 'MSI did not register an uninstall entry' }
          $exe = Get-ChildItem "$env:ProgramFiles\FlowNote", "$env:LOCALAPPDATA\FlowNote", "$env:LOCALAPPDATA\Programs\FlowNote" -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object Name -ne 'uninstall.exe' | Select-Object -First 1
          if (-not $exe) { throw 'could not find the installed FlowNote executable' }
          Write-Host "Installed $($exe.FullName)"

          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "FlowNote exited right after launch (code $($app.ExitCode))" }

          & ./packaging/windows/Uninstall-FlowNote.ps1 -RemoveData
          if ($LASTEXITCODE -ne 0) { throw "Uninstall-FlowNote.ps1 exited with $LASTEXITCODE" }

          if (Get-ItemProperty $roots -ErrorAction SilentlyContinue | Where-Object DisplayName -eq 'FlowNote') { throw 'uninstall entry still present' }
          if (Test-Path $exe.FullName) { throw "$($exe.FullName) still present" }
          Write-Host 'MSI: install, launch and uninstall all OK'

      # Exercises what the launch checks above can't: the Windows-only
      # http://<scheme>.localhost URLs for plugins and attachments, the
      # spreadsheet plugin end to end, and IPC through the installed app —
      # by attaching Playwright to WebView2's DevTools port.
      - name: "Test: installed app smoke test (protocols, plugins, IPC) via WebView2 CDP"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem package/*-setup.exe)[0].FullName
          Start-Process $setup -ArgumentList '/S' -Wait
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object DisplayName -eq 'FlowNote'
          $exe = Join-Path (Split-Path $entry.UninstallString.Trim('"') -Parent) 'FlowNote.exe'
          if (-not (Test-Path $exe)) { throw "expected the app binary at $exe (mainBinaryName)" }

          # Test hook in apps/tauri/src-tauri/src/lib.rs (create_main_window).
          $env:FLOWNOTE_WEBVIEW_DEBUG_PORT = '9222'
          $app = Start-Process $exe -PassThru
          try {
            node e2e-tauri/windows-smoke.mjs http://127.0.0.1:9222
            $code = $LASTEXITCODE
          } finally {
            & ./packaging/windows/Uninstall-FlowNote.ps1 -RemoveData
          }
          if ($code -ne 0) { throw "smoke test failed ($code)" }

      - name: Upload smoke-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: smoke-artifacts/
          if-no-files-found: ignore
